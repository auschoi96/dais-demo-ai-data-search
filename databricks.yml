bundle:
  name: dais-demo-ai-data-search

variables:
  catalog:
    description: Unity Catalog name for Yape demo tables
    default: ac_demo
  schema:
    description: Unity Catalog schema for Yape demo tables
    default: agents
  sql_warehouse_id:
    description: SQL warehouse ID for analytics queries and keyword search
  budget_policy_id:
    description: Optional budget policy for existing apps (leave unset for new apps)
  mlflow_experiment_id:
    description: |
      Experiment ID both agents trace into. DABs grants the app CAN_EDIT on it
      at deploy time; the experiment must already exist (the deploy fails with a
      404 otherwise). Create it via the MLflow UI or `mlflow experiments create`.
    default: "2177684156462207"

resources:
  apps:
    app:
      name: dais-demo-ai-data-search
      description: Yape AI-ready search demo — vibe coding vs AI-ready data
      source_code_path: ./
      budget_policy_id: ${var.budget_policy_id}
      user_api_scopes:
        - sql
        - serving.serving-endpoints
        - vectorsearch.vector-search-indexes
        - ai-gateway
        - mcp.functions

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

        - name: services-raw-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.yape_services_raw
            permission: SELECT

        - name: services-enriched-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.yape_services_enriched
            permission: SELECT

        - name: search-eval-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.yape_search_eval
            permission: SELECT

        - name: transactions-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.yape_transactions
            permission: SELECT

        - name: fn-search-raw
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.search_yape_services
            permission: EXECUTE

        - name: fn-search-enriched
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.search_yape_services_enriched
            permission: EXECUTE

        - name: fn-top-services-by-region
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.top_services_by_region
            permission: EXECUTE

        - name: fn-avg-ticket-by-cohort
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.avg_ticket_by_cohort
            permission: EXECUTE

        - name: fn-list-services-by-category
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.list_services_by_category
            permission: EXECUTE

        - name: fn-services-for-segment
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog}.${var.schema}.services_for_segment
            permission: EXECUTE

        - name: opus-endpoint
          serving_endpoint:
            name: databricks-claude-opus-4-6
            permission: CAN_QUERY

        - name: mlflow-experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_EDIT

targets:
  dev:
    default: true
    mode: development
    # Disable the default [dev <user>] name prefix so DABs binds to the
    # already-existing experiment at mlflow_experiment_path (id 2177684156462207)
    # instead of creating a parallel renamed copy each deploy.
    presets:
      name_prefix: ""
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

    variables:
      catalog: ac_demo
      schema: agents
      sql_warehouse_id: "01370556fad60fda"
      budget_policy_id: "5b62fa02-8671-46d3-96ac-64c1725dc9d9"

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

    variables:
      catalog: ac_demo
      schema: agents
      sql_warehouse_id: "01370556fad60fda"
      budget_policy_id: "5b62fa02-8671-46d3-96ac-64c1725dc9d9"
